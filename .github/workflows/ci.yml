name: TestMES2 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python unit tests (no secrets or database)
        run: python -m unittest discover -s tests -v
      - name: Python syntax check
        run: python -m compileall -q app.py backend knowledge scripts tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: find static/js -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
